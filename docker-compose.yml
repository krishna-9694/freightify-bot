version: '3'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  freightify-bot:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./common:/app/common
      - ./uploads:/app/uploads
      - ./faiss_index_openai:/app/faiss_index_openai
      - ./faiss_index_ollama:/app/faiss_index_ollama
      - ./.env:/app/.env
    environment:
      - STREAMLIT_CLOUD=0  # Allow Ollama usage
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: